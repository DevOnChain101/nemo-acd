[package]
name = "synthesis-hooks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
synthesis-core = { path = "../synthesis-core" }
synthesis-terminal = { path = "../synthesis-terminal" }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "time"] }
tokio-util = { version = "0.7.20", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "time", "macros"] }
