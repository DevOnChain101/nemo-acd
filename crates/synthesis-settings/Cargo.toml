[package]
name = "synthesis-settings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
synthesis-config = { path = "../synthesis-config" }
synthesis-hooks = { path = "../synthesis-hooks" }
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[target.'cfg(unix)'.dependencies]
# geteuid() without unsafe: marker directories must belong to the current user.
rustix = { version = "1", default-features = false, features = ["process"] }

[dev-dependencies]
tempfile = "3.27.0"
