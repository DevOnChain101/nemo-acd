[package]
name = "synthesis-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
synthesis-config = { path = "../synthesis-config" }
synthesis-context = { path = "../synthesis-context" }
synthesis-core = { path = "../synthesis-core" }
synthesis-events = { path = "../synthesis-events" }
synthesis-hooks = { path = "../synthesis-hooks" }
synthesis-permissions = { path = "../synthesis-permissions" }
synthesis-providers = { path = "../synthesis-providers" }
synthesis-settings = { path = "../synthesis-settings" }
synthesis-tools = { path = "../synthesis-tools" }
synthesis-verification = { path = "../synthesis-verification" }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
# default-features off: no HTTP schema resolver (same as synthesis-tools).
jsonschema = { version = "0.60", default-features = false }
serde_json = "1.0.154"
sha2 = "0.10"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "macros", "time", "sync"] }
tokio-util = { version = "0.7.20", default-features = false }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
synthesis-terminal = { path = "../synthesis-terminal" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync"] }
