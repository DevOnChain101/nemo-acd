[package]
name = "nemo-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
nemo-config = { path = "../nemo-config" }
nemo-core = { path = "../nemo-core" }
nemo-events = { path = "../nemo-events" }
nemo-hooks = { path = "../nemo-hooks" }
nemo-permissions = { path = "../nemo-permissions" }
nemo-providers = { path = "../nemo-providers" }
nemo-settings = { path = "../nemo-settings" }
nemo-tools = { path = "../nemo-tools" }
nemo-verification = { path = "../nemo-verification" }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
# default-features off: no HTTP schema resolver (same as nemo-tools).
jsonschema = { version = "0.60", default-features = false }
serde_json = "1.0.154"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "macros", "time", "sync"] }
tokio-util = { version = "0.7.20", default-features = false }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
nemo-terminal = { path = "../nemo-terminal" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync"] }
