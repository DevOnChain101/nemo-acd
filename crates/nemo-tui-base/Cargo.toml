[package]
name = "nemo-tui-base"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Low-level terminal UI layer: key parser, SGR encoder, screen sequences, selection, line editor, completion"

[lints]
workspace = true

[dependencies]
nemo-config = { path = "../nemo-config" }
nemo-platform = { path = "../nemo-platform" }
# Raw mode and terminal size only: our own parser reads the bytes (see terminal.rs).
crossterm = { version = "0.29.0", default-features = false, features = ["windows"] }
unicode-properties = { version = "0.1.4", default-features = false, features = ["emoji"] }
unicode-segmentation = "1.13.3"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.5"

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
