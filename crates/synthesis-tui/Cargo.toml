[package]
name = "synthesis-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Interactive terminal app (R5c): a client of the harness event stream, as a library"

[lints]
workspace = true

[dependencies]
synthesis-config = { path = "../synthesis-config" }
synthesis-core = { path = "../synthesis-core" }
synthesis-events = { path = "../synthesis-events" }
synthesis-harness = { path = "../synthesis-harness" }
synthesis-permissions = { path = "../synthesis-permissions" }
synthesis-providers = { path = "../synthesis-providers" }
synthesis-session = { path = "../synthesis-session" }
synthesis-tools = { path = "../synthesis-tools" }
synthesis-tui-base = { path = "../synthesis-tui-base" }
synthesis-tui-render = { path = "../synthesis-tui-render" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "macros", "time", "sync"] }
tokio-util = { version = "0.7.20", default-features = false }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.5"

[dev-dependencies]
synthesis-terminal = { path = "../synthesis-terminal" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync"] }
