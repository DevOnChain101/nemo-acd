[package]
name = "nemo-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
nemo-config = { path = "../nemo-config" }
rmcp = { version = "3.7.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
http = "1"
process-wrap = { version = "10", default-features = false, features = ["tokio1", "process-group", "job-object"] }
serde_json = "1.0.154"
sha1 = "0.10"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "time", "process", "macros", "sync", "io-util"] }
tokio-util = { version = "0.7.20", default-features = false }
which = "8"

[dev-dependencies]
rmcp = { version = "3.7.0", features = ["server", "transport-io", "transport-streamable-http-server"] }
axum = "0.8"
tokio = { version = "1.54.1", features = ["full"] }
