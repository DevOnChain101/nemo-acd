[package]
name = "nemo-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
nemo-config = { path = "../nemo-config" }
rmcp = { version = "3.7.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
http = "1"
process-wrap = { version = "10", default-features = false, features = ["tokio1", "process-group", "job-object", "kill-on-drop"] }
serde_json = "1.0.154"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
sha1 = "0.11"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "time", "process", "macros", "sync", "io-util", "net"] }
tokio-util = { version = "0.7.20", default-features = false }
which = "8"

[dev-dependencies]
rmcp = { version = "3.7.0", features = ["server", "transport-io", "transport-streamable-http-server"] }
axum = "0.8"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
