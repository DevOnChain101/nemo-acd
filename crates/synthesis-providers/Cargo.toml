[package]
name = "synthesis-providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
synthesis-config = { path = "../synthesis-config" }
synthesis-events = { path = "../synthesis-events" }
# No `system-proxy` (default feature): proxy settings are explicit config, never read from the
# process environment (project rule: only SYNTHESIS_* variables). rustls TLS, no OpenSSL.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "http2"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "time", "sync", "macros"] }
tokio-util = { version = "0.7.20", default-features = false }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
indexmap = "2.14.2"
fastrand = "2"

[dev-dependencies]
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
