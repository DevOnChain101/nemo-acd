[package]
name = "nemo-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Interactive terminal app (R5c): a client of the harness event stream, as a library"

[lints]
workspace = true

[dependencies]
nemo-config = { path = "../nemo-config" }
nemo-core = { path = "../nemo-core" }
nemo-events = { path = "../nemo-events" }
nemo-harness = { path = "../nemo-harness" }
nemo-permissions = { path = "../nemo-permissions" }
nemo-providers = { path = "../nemo-providers" }
nemo-session = { path = "../nemo-session" }
nemo-tools = { path = "../nemo-tools" }
nemo-tui-base = { path = "../nemo-tui-base" }
nemo-tui-render = { path = "../nemo-tui-render" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "macros", "time", "sync"] }
tokio-util = { version = "0.7.20", default-features = false }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.5"

[dev-dependencies]
nemo-terminal = { path = "../nemo-terminal" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync"] }
