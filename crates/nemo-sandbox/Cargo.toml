[package]
name = "nemo-sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# `NEMO_TEST_FORCE_BACKEND=landlock-only|none` forces `detect()` (Landlock only / no sandbox). Debug builds only.
test-backend = []

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(target_os = "linux")'.dependencies]
# Landlock is best-effort by default; the code sets HardRequirement explicitly.
landlock = "0.4.7"

[dev-dependencies]
tempfile = "3.27.0"
