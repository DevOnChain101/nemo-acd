[package]
name = "synthesis-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "synth"
path = "src/main.rs"

[features]
# Enables `--provider fake:<script.json>` (scripted model, no network). Debug builds only.
test-provider = ["synthesis-sandbox/test-backend"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
synthesis-browser = { path = "../../crates/synthesis-browser" }
synthesis-config = { path = "../../crates/synthesis-config" }
synthesis-context = { path = "../../crates/synthesis-context" }
synthesis-core = { path = "../../crates/synthesis-core" }
synthesis-events = { path = "../../crates/synthesis-events" }
synthesis-harness = { path = "../../crates/synthesis-harness" }
synthesis-hooks = { path = "../../crates/synthesis-hooks" }
synthesis-mcp = { path = "../../crates/synthesis-mcp" }
synthesis-permissions = { path = "../../crates/synthesis-permissions" }
synthesis-providers = { path = "../../crates/synthesis-providers" }
synthesis-sandbox = { path = "../../crates/synthesis-sandbox" }
synthesis-session = { path = "../../crates/synthesis-session" }
synthesis-settings = { path = "../../crates/synthesis-settings" }
synthesis-terminal = { path = "../../crates/synthesis-terminal" }
synthesis-tui = { path = "../../crates/synthesis-tui" }
synthesis-tui-base = { path = "../../crates/synthesis-tui-base" }
synthesis-tools = { path = "../../crates/synthesis-tools" }
synthesis-verification = { path = "../../crates/synthesis-verification" }
synthesis-workspace = { path = "../../crates/synthesis-workspace" }
rusqlite = { version = "0.41", features = ["bundled"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
serde_json = "1.0.154"
sha2 = "0.10"
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "signal", "time", "sync", "macros"] }
tokio-util = { version = "0.7.20", default-features = false }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
# O_NOFOLLOW constant only (no unsafe): note files are never opened through a symlink.
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
