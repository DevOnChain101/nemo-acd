[package]
name = "nemo-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "nemo"
path = "src/main.rs"

[features]
# Enables `--provider fake:<script.json>` (scripted model, no network). Debug builds only.
test-provider = ["nemo-sandbox/test-backend"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
nemo-browser = { path = "../../crates/nemo-browser" }
nemo-config = { path = "../../crates/nemo-config" }
nemo-context = { path = "../../crates/nemo-context" }
nemo-core = { path = "../../crates/nemo-core" }
nemo-events = { path = "../../crates/nemo-events" }
nemo-harness = { path = "../../crates/nemo-harness" }
nemo-hooks = { path = "../../crates/nemo-hooks" }
nemo-mcp = { path = "../../crates/nemo-mcp" }
nemo-permissions = { path = "../../crates/nemo-permissions" }
nemo-providers = { path = "../../crates/nemo-providers" }
nemo-sandbox = { path = "../../crates/nemo-sandbox" }
nemo-session = { path = "../../crates/nemo-session" }
nemo-settings = { path = "../../crates/nemo-settings" }
nemo-terminal = { path = "../../crates/nemo-terminal" }
nemo-tui = { path = "../../crates/nemo-tui" }
nemo-tui-base = { path = "../../crates/nemo-tui-base" }
nemo-tools = { path = "../../crates/nemo-tools" }
nemo-verification = { path = "../../crates/nemo-verification" }
nemo-workspace = { path = "../../crates/nemo-workspace" }
rusqlite = { version = "0.41", features = ["bundled"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
serde_json = "1.0.154"
sha2 = "0.10"
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "signal", "time", "sync", "macros"] }
tokio-util = { version = "0.7.20", default-features = false }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
