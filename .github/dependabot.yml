# Keeps SHA-pinned actions, cargo and npm dependencies current. Review the diff of every bump (docs/RELEASE.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
  # npm: no package.json with dependencies exists (packages are generated by scripts/package-npm.mjs, the JS
  # under tests/ are fixtures). Add an `npm` entry when a real manifest appears; Dependabot errors on a directory without one.
