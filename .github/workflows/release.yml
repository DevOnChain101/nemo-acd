# Release pipeline. Trigger: push of a tag v*. Produces a DRAFT GitHub Release; the `publish` job (environment approval) makes it public,
# then `npm-publish` pushes the npm packages (with provenance) if an npm credential is configured (docs/RELEASE.md "npm").
# Manual run (workflow_dispatch, any branch) = DRY RUN: builds and packages everything, uploads artifact `release-assets`,
# skips the tag checks, attestation, GitHub Release and npm. Nothing is published.
# UNVERIFIED: never run on GitHub. All actions are pinned to commit SHAs; the gate job refuses the release otherwise.
# Security notes: trigger is tag push only (no pull_request_target, no untrusted PR code with secrets); no ${{ }} of
# user-controlled data inside run: scripts (values go through env:); signing secrets are ENVIRONMENT secrets of `release`.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  # Release-policy gate: runs before anything else. Scripts come from the tagged commit, which must be on main (reviewed).
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Tagged commit is on main
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_SHA is not an ancestor of origin/main"; exit 1; }
      - name: Tag policy (annotated, verified, points at this commit, maintainer allowlist, fail closed)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SYNTHESIS_ALLOW_ANY_VERIFIED_TAGGER: ${{ vars.SYNTHESIS_ALLOW_ANY_VERIFIED_TAGGER }}
        run: bash scripts/check-release-tag.sh
      - run: node scripts/check-action-pins.mjs
      - name: Repository placeholder is replaced and matches this repository
        env:
          REPO: ${{ github.repository }}
        run: node scripts/check-placeholders.mjs --expect "$REPO"

  # Whole CI workflow re-run on the tagged commit; any red job blocks every job below.
  ci:
    needs: gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  version:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: v
        run: |
          crate=$(awk -F'"' '/^version *=/ {print $2; exit}' Cargo.toml)
          tag="$crate"   # dry run (workflow_dispatch): no tag, use the workspace version
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag="${GITHUB_REF_NAME#v}"
            case "$tag" in ''|*[!0-9A-Za-z.+-]*) echo "::error::bad tag"; exit 1;; esac
            [ "$tag" = "$crate" ] || { echo "::error::tag v$tag != workspace version $crate"; exit 1; }
          fi
          echo "version=$tag" >>"$GITHUB_OUTPUT"
          case "$tag" in *-*) echo "prerelease=true" >>"$GITHUB_OUTPUT";; *) echo "prerelease=false" >>"$GITHUB_OUTPUT";; esac

  build:
    name: build ${{ matrix.target }}
    needs: [ci, version]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin,       os: macos-latest,     ext: tar.gz, experimental: false }
          - { target: aarch64-apple-darwin,      os: macos-latest,     ext: tar.gz, experimental: false }
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-22.04,     ext: tar.gz, experimental: false } # old glibc baseline
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, ext: tar.gz, experimental: false }
          # musl: aws-lc-sys (rustls) and bundled SQLite compile C; musl-gcc is enough in theory. Unverified.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-22.04,     ext: tar.gz, experimental: true }
          - { target: x86_64-pc-windows-msvc,    os: windows-latest,   ext: zip,    experimental: false }
          # aws-lc-sys on arm64 MSVC may need clang/NASM; unverified.
          - { target: aarch64-pc-windows-msvc,   os: windows-11-arm,   ext: zip,    experimental: true }
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
      EXT: ${{ matrix.ext }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain (rust-toolchain.toml) and target
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
      - name: musl build tools
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >>"$GITHUB_ENV"
      - name: Build
        run: |
          pkgs=(-p synthesis-cli)
          # Landlock backend looks for synthesis-sandbox-exec next to synth (crates/synthesis-sandbox/src/linux.rs).
          case "$TARGET" in *linux*) pkgs+=(-p synthesis-sandbox);; esac
          cargo build --release --locked --target "$TARGET" "${pkgs[@]}"
      - name: Locate artifacts
        run: |
          d="target/$TARGET/release"
          exe=""; case "$TARGET" in *windows*) exe=".exe";; esac
          echo "BIN=$d/synth$exe" >>"$GITHUB_ENV"
          case "$TARGET" in *linux*) echo "HELPER=$d/synthesis-sandbox-exec" >>"$GITHUB_ENV";; esac
      - name: Prove the scripted test provider is absent
        run: bash scripts/check-no-test-provider.sh "$BIN"
      - name: Smoke test
        run: |
          "$BIN" --version | tee version.txt
          grep -q "synth $VERSION" version.txt
          "$BIN" doctor --cwd "$RUNNER_TEMP"

      - name: Package
        run: |
          name="synthesis-$VERSION-$TARGET"
          mkdir -p "dist/$name"
          cp "$BIN" "dist/$name/"
          if [ -n "${HELPER:-}" ]; then cp "$HELPER" "dist/$name/"; fi
          cp LICENSE NOTICE README.md "dist/$name/"
          cd dist || exit 1
          if [ "$EXT" = zip ]; then 7z a -tzip "$name.zip" "$name" >/dev/null; else tar -czf "$name.tar.gz" "$name"; fi
          ls -l
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: archive-${{ matrix.target }}
          path: dist/synthesis-*.*
          if-no-files-found: error
      - name: Keep raw binaries for the npm generator
        run: |
          mkdir -p raw
          cp "$BIN" raw/
          if [ -n "${HELPER:-}" ]; then cp "$HELPER" raw/; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: raw-${{ matrix.target }}
          path: raw/*
          if-no-files-found: error

  sbom:
    needs: [ci, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
        with:
          tool: cargo-cyclonedx
      - name: Generate CycloneDX SBOM for synthesis-cli
        run: |
          cd apps/cli || exit 1
          cargo cyclonedx --format json
          ls -l ./*.cdx.json
          mkdir -p ../../sbom && cp ./*.cdx.json "../../sbom/synthesis-$VERSION.cdx.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom/*

  npm-packages:
    needs: [build, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: raw-*
          path: raw
      - name: Generate and pack npm packages (published by the npm-publish job)
        run: |
          node scripts/package-npm.mjs --version "$VERSION" --raw raw --out npm-out --require-all
          mkdir -p npm-tgz
          for d in npm-out/*/; do (cd "$d" && npm pack --pack-destination "$GITHUB_WORKSPACE/npm-tgz"); done
          ls -l npm-tgz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-tarballs
          path: npm-tgz/*.tgz

  checksums:
    needs: [build, sbom, npm-packages, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "{archive-*,sbom,npm-tarballs}"
          path: assets
          merge-multiple: true
      - name: Add the installers
        run: cp scripts/install.sh scripts/install.ps1 assets/
      - name: Checksums
        working-directory: assets
        run: |
          ls -l
          sha256sum -- synthesis-*.tar.gz synthesis-*.zip *.tgz *.cdx.json install.sh install.ps1 > SHA256SUMS
          cat SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Require the non-experimental targets
        working-directory: assets
        run: |
          for t in x86_64-apple-darwin aarch64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-pc-windows-msvc; do
            ls synthesis-*-"$t".* >/dev/null || { echo "::error::missing archive for $t"; exit 1; }
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: assets/*
          if-no-files-found: error

  # Attestation job (npm-publish also has id-token, for npm provenance). SHA256SUMS is attested too, so installers can authenticate it.
  attest:
    needs: checksums
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write       # keyless signing
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: assets
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            assets/synthesis-*.tar.gz
            assets/synthesis-*.zip
            assets/*.tgz
            assets/SHA256SUMS
            assets/install.sh
            assets/install.ps1

  release:
    needs: [attest, version]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write       # create the draft release
    steps:
      # Same commit the gate approved (GITHUB_SHA); only used to run the policy script and read the allowlist.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false   # check-release-tag.sh passes GH_TOKEN as a one-off header for its tag fetch
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: assets
      - name: Draft GitHub Release (tag re-checked before and after creation)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRE: ${{ needs.version.outputs.prerelease }}
          SYNTHESIS_ALLOW_ANY_VERIFIED_TAGGER: ${{ vars.SYNTHESIS_ALLOW_ANY_VERIFIED_TAGGER }}
        run: |
          # The gate ran long ago (environment approval can take days): the tag must still be the built commit.
          bash scripts/check-release-tag.sh
          flag=""; [ "$PRE" = true ] && flag="--prerelease"
          gh release create "$TAG" --draft --verify-tag --target "$GITHUB_SHA" $flag \
            --title "Synthesis $TAG" --generate-notes assets/*
          if ! bash scripts/check-release-tag.sh; then
            gh release delete "$TAG" --yes   # tag moved during creation: do not leave a draft on the wrong commit
            exit 1
          fi

  # Separate small job so publishing needs its own environment approval and re-verifies the draft before going public.
  publish:
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write       # edit the release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Re-verify tag and draft target, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SYNTHESIS_ALLOW_ANY_VERIFIED_TAGGER: ${{ vars.SYNTHESIS_ALLOW_ANY_VERIFIED_TAGGER }}
        run: |
          bash scripts/check-release-tag.sh
          read -r draft target < <(gh release view "$TAG" --json isDraft,targetCommitish --jq '[.isDraft, .targetCommitish] | @tsv')
          [ "$draft" = true ] || { echo "::error::release $TAG is not a draft"; exit 1; }
          [ "$target" = "$GITHUB_SHA" ] || { echo "::error::draft targets '$target', expected $GITHUB_SHA"; exit 1; }
          gh release edit "$TAG" --draft=false

  # Publishes the npm tarballs built above. Skips (green, with a log line) unless an npm credential is configured:
  # secret NPM_TOKEN (granular, publish-only), or repo variable SYNTHESIS_NPM_TRUSTED_PUBLISHING=true once npm trusted publishing
  # is set up for this repo + workflow file `release.yml` + environment `release` (then no token exists at all).
  npm-publish:
    needs: [publish, version]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write       # npm provenance + trusted publishing (OIDC)
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRE: ${{ needs.version.outputs.prerelease }}
      HAVE_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
      NPM_TRUSTED: ${{ vars.SYNTHESIS_NPM_TRUSTED_PUBLISHING }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"   # npm >= 11.5.1 is required for trusted publishing
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: assets
      - name: npm publish --provenance (platform packages first, the main package last)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "$HAVE_NPM_TOKEN" != true ] && [ "$NPM_TRUSTED" != true ]; then
            echo "SKIP npm publish: no NPM_TOKEN secret and SYNTHESIS_NPM_TRUSTED_PUBLISHING is not 'true' (docs/RELEASE.md, npm)"; exit 0
          fi
          # An empty NODE_AUTH_TOKEN would make npm try (and fail) token auth instead of OIDC.
          if [ "$HAVE_NPM_TOKEN" != true ]; then unset NODE_AUTH_TOKEN; fi
          tag=latest; [ "$PRE" = true ] && tag=next
          main="assets/devonchain101-synthesis-$VERSION.tgz"
          [ -f "$main" ] || { echo "::error::$main missing"; exit 1; }
          for f in assets/devonchain101-synthesis-*-"$VERSION".tgz "$main"; do
            npm publish "$f" --provenance --access public --tag "$tag"
          done
