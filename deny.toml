# cargo-deny policy. Run: cargo deny check
[graph]
targets = [
  "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-musl",
  "x86_64-apple-darwin", "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"
ignore = [] # add { id = "RUSTSEC-....", reason = "..." } only with a written reason

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "MPL-2.0", "OpenSSL", "BSL-1.0", "MIT-0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "allow" # workspace path deps have no version; crates are not published
deny = [
  # TLS is rustls; keep OpenSSL out of the static release binaries.
  { name = "openssl" },
  { name = "openssl-sys" },
  { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
